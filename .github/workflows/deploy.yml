name: Deploy EduScribe AI to GCP Cloud Run

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: asia-southeast1 # Singapore region
  SERVICE_NAME: eduscribe-ai
  REPOSITORY: eduscribe-repo
  IMAGE: eduscribe-app

jobs:
  test-and-deploy:
    name: Run Tests, Build Container & Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Run Tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m unittest tests/test_pipeline.py

      - name: Google Cloud Authentication
        if: env.PROJECT_ID != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: env.PROJECT_ID != ''
        uses: google-github-actions/setup-gcloud@v2

      - name: Build Container and Deploy to Cloud Run
        if: env.PROJECT_ID != ''
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source . \
            --region=${{ env.GAR_LOCATION }} \
            --platform=managed \
            --allow-unauthenticated \
            --memory=2Gi \
            --cpu=2 \
            --port=8501 \
            --set-env-vars="GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},GCP_PROJECT_ID=${{ env.PROJECT_ID }}"
